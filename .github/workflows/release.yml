# Tag-driven release.
#
# Publishes, for every OS it builds: the installer, the **portable
# executable**, and checksums. The portable binary is not a convenience — a
# published desktop tool has to be runnable without an installer, admin rights
# or prerequisites, and an installer may ship in addition, never instead.
#
# **Tagging publishes Windows only.** This tool has one user, on Windows, and
# building three platforms every time meant maintaining and verifying two sets
# of artifacts nobody downloaded. Linux and macOS are not gone: they are still
# built by the same job from the same matrix, on demand.
#
# To publish them for a tag that already exists, run this workflow manually
# (Actions → release → Run workflow), pick the **tag** as the ref, and set
# platforms to `all`. The new assets are added to that tag's existing release
# alongside the Windows ones. Because it must attach to a release, a manual run
# has to target a tag — `plan` refuses a branch rather than building for an hour
# and publishing nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [windows, all]
        default: windows

permissions:
  contents: read

jobs:
  # Which platforms this run builds. A job rather than an inline expression
  # because the matrix has to be chosen from an input, and a shell script that
  # can be read top to bottom beats a nested ternary inside `fromJSON`.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Refuse a manual run that could not publish
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Run this against a tag, not ${{ github.ref }}."
          echo "The assets attach to that tag's release; from a branch there is nothing to attach to."
          exit 1

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          windows='{"os":"windows-latest","portable":"bugsleuth-app.exe","cli":"bugsleuth.exe","suffix":"windows-x64.exe"}'
          linux='{"os":"ubuntu-latest","portable":"bugsleuth-app","cli":"bugsleuth","suffix":"linux-x64"}'
          macos='{"os":"macos-latest","portable":"bugsleuth-app","cli":"bugsleuth","suffix":"macos-arm64"}'

          # Empty on a tag push, which is the default path: Windows only.
          if [ "${{ inputs.platforms }}" = "all" ]; then
            echo "matrix=[$windows,$linux,$macos]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[$windows]" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The manifest version is taken from the tag, while the binary embeds the
      # workspace version. If they disagree the updater advertises one version
      # and delivers another, trapping every client in a re-offer loop. The gate
      # only checks the three source files agree with each other, never with the
      # tag, so that invariant is asserted here before anything is built.
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag_version="${GITHUB_REF_NAME#v}"
          [ -n "$app_version" ] || {
            echo "Cargo.toml has no workspace version"
            exit 1
          }
          [ "$tag_version" = "$app_version" ] || {
            echo "release tag $GITHUB_REF_NAME disagrees with embedded app version $app_version"
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev

      # The gate runs again on the tagged commit. CI passing on the branch is
      # not evidence about the tag if anything landed between them.
      - name: Gate
        shell: bash
        run: ./scripts/verify.sh

      # Default features only. WebDriver support is test-only and must not be
      # in anything published; the check below proves it is not.
      # Two separate builds, because `tauri build` produces the app and nothing
      # else. The CLI existed on Windows only as a side effect of the gate's
      # release build, which verify.sh did not do — so v0.2.0 published Windows
      # artifacts and failed on both other platforms with "expected executable
      # missing". Publish what you intend to build, rather than what a previous
      # step happened to leave behind.
      - name: Build the CLI
        run: cargo build --release -p bugsleuth-cli

      # Default features only. WebDriver support is test-only and must not be
      # in anything published; the check below proves it is not.
      #
      # Signed, because the updater refuses anything that does not verify
      # against the public key compiled into the app. Missing secrets do not
      # fail this step — the build simply produces no signature — so the
      # artifact step below treats an absent `.sig` as a failure. An unsigned
      # release publishes an update every client then rejects, which looks
      # exactly like a working release until someone tries to install it.
      - name: Build the app
        run: npx --no-install tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          out=release-artifacts
          mkdir -p "$out"

          # Named explicitly: this workspace produces two executables, and "the
          # first one that is not a setup" would publish whichever sorted first.
          for pair in "${{ matrix.portable }}:BugSleuth-portable-${{ matrix.suffix }}" \
                      "${{ matrix.cli }}:bugsleuth-cli-${{ matrix.suffix }}"; do
            src="target/release/${pair%%:*}"
            [ -f "$src" ] || { echo "expected executable missing: $src"; exit 1; }
            cp "$src" "$out/${pair##*:}"
          done

          # There is no automation plugin to check for any more. The acceptance
          # suite turned out not to need one — tauri-driver drives the shipped
          # binary directly — so the feature, the plugin and the test-only
          # capability were deleted rather than left in place with a guard
          # around them. A check that can no longer fail is worse than no
          # check: it reads as protection and is not.

          bundles=$(find target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) 2>/dev/null || true)
          [ -n "$bundles" ] || { echo "no installer was produced"; exit 1; }
          while IFS= read -r b; do cp "$b" "$out/"; done <<< "$bundles"

          # The update manifest, Windows only: that is the platform a tag
          # publishes, and a manifest naming a platform this run did not build
          # would offer an update that 404s.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            sig=$(find target/release/bundle -name '*-setup.exe.sig' | head -1)
            if [ -z "$sig" ]; then
              echo "no signature was produced. TAURI_SIGNING_PRIVATE_KEY and"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be set as repository secrets;"
              echo "without them every client refuses the update."
              exit 1
            fi
            bundle="${sig%.sig}"
            [ -f "$bundle" ] || { echo "signature $sig has no bundle beside it"; exit 1; }

            version="${GITHUB_REF_NAME#v}"
            asset=$(basename "$bundle")
            printf '{\n  "version": "%s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "https://github.com/Swatto86/BugSleuth/releases/download/%s/%s"\n    }\n  }\n}\n' \
              "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(tr -d '\n' < "$sig")" \
              "${GITHUB_REF_NAME}" "$asset" > "$out/latest.json"

            python -c "import json,sys;json.load(open(sys.argv[1]));print('latest.json is valid JSON')" "$out/latest.json"
          fi

          ( cd "$out" && sha256sum * > "SHA256SUMS-${{ matrix.suffix }}.txt" 2>/dev/null \
            || shasum -a 256 * > "SHA256SUMS-${{ matrix.suffix }}.txt" )
          ls -la "$out"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.suffix }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
