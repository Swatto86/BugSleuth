# Tag-driven release.
#
# Publishes, for every OS it builds: the installer, the **portable
# executable**, and checksums. The portable binary is not a convenience — a
# published desktop tool has to be runnable without an installer, admin rights
# or prerequisites, and an installer may ship in addition, never instead.
#
# **Tagging publishes Windows only.** This tool has one user, on Windows, and
# building three platforms every time meant maintaining and verifying two sets
# of artifacts nobody downloaded. Linux and macOS are not gone: they are still
# built by the same job from the same matrix, on demand.
#
# To publish them for a tag that already exists, run this workflow manually
# (Actions → release → Run workflow), pick the **tag** as the ref, and set
# platforms to `all`. The new assets are added to that tag's existing release
# alongside the Windows ones. Because it must attach to a release, a manual run
# has to target a tag — `plan` refuses a branch rather than building for an hour
# and publishing nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [windows, all]
        default: windows

permissions:
  contents: write

jobs:
  # Which platforms this run builds. A job rather than an inline expression
  # because the matrix has to be chosen from an input, and a shell script that
  # can be read top to bottom beats a nested ternary inside `fromJSON`.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Refuse a manual run that could not publish
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Run this against a tag, not ${{ github.ref }}."
          echo "The assets attach to that tag's release; from a branch there is nothing to attach to."
          exit 1

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          windows='{"os":"windows-latest","portable":"bugsleuth-app.exe","cli":"bugsleuth.exe","suffix":"windows-x64.exe"}'
          linux='{"os":"ubuntu-latest","portable":"bugsleuth-app","cli":"bugsleuth","suffix":"linux-x64"}'
          macos='{"os":"macos-latest","portable":"bugsleuth-app","cli":"bugsleuth","suffix":"macos-arm64"}'

          # Empty on a tag push, which is the default path: Windows only.
          if [ "${{ inputs.platforms }}" = "all" ]; then
            echo "matrix=[$windows,$linux,$macos]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[$windows]" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev

      # The gate runs again on the tagged commit. CI passing on the branch is
      # not evidence about the tag if anything landed between them.
      - name: Gate
        shell: bash
        run: ./scripts/verify.sh

      # Default features only. WebDriver support is test-only and must not be
      # in anything published; the check below proves it is not.
      # Two separate builds, because `tauri build` produces the app and nothing
      # else. The CLI existed on Windows only as a side effect of the gate's
      # release build, which verify.sh did not do — so v0.2.0 published Windows
      # artifacts and failed on both other platforms with "expected executable
      # missing". Publish what you intend to build, rather than what a previous
      # step happened to leave behind.
      - name: Build the CLI
        run: cargo build --release -p bugsleuth-cli

      # Default features only. WebDriver support is test-only and must not be
      # in anything published; the check below proves it is not.
      - name: Build the app
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          out=release-artifacts
          mkdir -p "$out"

          # Named explicitly: this workspace produces two executables, and "the
          # first one that is not a setup" would publish whichever sorted first.
          for pair in "${{ matrix.portable }}:BugSleuth-portable-${{ matrix.suffix }}" \
                      "${{ matrix.cli }}:bugsleuth-cli-${{ matrix.suffix }}"; do
            src="target/release/${pair%%:*}"
            [ -f "$src" ] || { echo "expected executable missing: $src"; exit 1; }
            cp "$src" "$out/${pair##*:}"
          done

          # There is no automation plugin to check for any more. The acceptance
          # suite turned out not to need one — tauri-driver drives the shipped
          # binary directly — so the feature, the plugin and the test-only
          # capability were deleted rather than left in place with a guard
          # around them. A check that can no longer fail is worse than no
          # check: it reads as protection and is not.

          bundles=$(find target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) 2>/dev/null || true)
          [ -n "$bundles" ] || { echo "no installer was produced"; exit 1; }
          while IFS= read -r b; do cp "$b" "$out/"; done <<< "$bundles"

          ( cd "$out" && sha256sum * > "SHA256SUMS-${{ matrix.suffix }}.txt" 2>/dev/null \
            || shasum -a 256 * > "SHA256SUMS-${{ matrix.suffix }}.txt" )
          ls -la "$out"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
