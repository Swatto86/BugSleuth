# The gate, on every platform the tool claims to support.
#
# One job per OS rather than Windows alone, because "it compiles here" has never
# been evidence about anywhere else — and this project ships a desktop app whose
# webview, process handling and path rules all differ between them.
#
# Each platform runs the same gate a developer runs locally: verify.ps1 on
# Windows, verify.sh elsewhere. Two definitions of green drift, and the one that
# drifts is always the one nobody reads.
name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            gate: pwsh ./scripts/verify.ps1
          - os: ubuntu-latest
            gate: bash ./scripts/verify.sh
          - os: macos-latest
            gate: bash ./scripts/verify.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Tauri's Linux backend is webkit2gtk, which is not on the runner image.
      # Without these the Rust build fails at link time with a pkg-config error
      # that says nothing about Tauri.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Gate
        shell: bash
        run: ${{ matrix.gate }}
