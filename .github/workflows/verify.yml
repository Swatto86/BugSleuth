# The gate, on every platform the tool claims to support.
#
# One job per OS rather than Windows alone, because "it compiles here" has never
# been evidence about anywhere else — and this project ships a desktop app whose
# webview, process handling and path rules all differ between them.
#
# Every platform runs the same gate a developer runs locally, and it is now
# literally the same file: two definitions of green drifted three times in a
# day, so there is only one.
name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Tauri's Linux backend is webkit2gtk, which is not on the runner image.
      # Without these the Rust build fails at link time with a pkg-config error
      # that says nothing about Tauri.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      # One command everywhere. There is one gate now; the platforms differ in
      # what they run it on, not in what it checks.
      - name: Gate
        shell: bash
        run: ./scripts/verify.sh
